spring.application.name=finalsbackendjavaspringbootsmack

server.port=8080

# Real database credentials live in application-local.properties (not committed to Git).
spring.profiles.active=local

# Create/update the tables automatically from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Do not leak stack traces in error responses
server.error.include-stacktrace=never

# Frontend address allowed by CORS (Vite dev server)
app.cors.allowed-origin=http://localhost:5173
